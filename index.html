<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDG Portfolio Update 2026 Q3</title>

<style>
:root{
  /* Layout: an Excel-style workbook. Title bar, formula bar, scrolling grid, sheet tabs, status bar. One light theme on purpose, to match the workbook. */
  --paper:#ffffff;
  --chrome:#f3f2f1;
  --line:#d1d1d1;
  --grid:#e2e2e2;
  --ink:#141414;
  --muted:#5f5e5c;
  --accent:#217346;
  --accent-soft:#e2efe7;
  --fill-yellow:#ffff00;
  --fill-orange:#ffc000;
  --fill-tan:#c9ad73;
  --fill-green:#92d050;
  --warn-soft:#fde7e4;
  --warn-ink:#a4262c;
  --font-cell:Calibri, Carlito, "Segoe UI", Arial, sans-serif;
  --font-ui:"Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --zoom:1;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--chrome);color:var(--ink);font-family:var(--font-ui);font-size:13px;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* title bar */
.titlebar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 16px;background:var(--paper);border-bottom:1px solid var(--line);flex-wrap:wrap}
.doc{display:flex;align-items:center;gap:10px;min-width:0}
.doc svg{flex:none}
.doc-name{font-weight:600;font-size:14px;white-space:nowrap}
.doc-sub{color:var(--muted);font-size:12px}
.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:6px 12px;border-radius:4px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--chrome)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#1a5c38}
.btn[disabled]{opacity:.6;cursor:progress}
.pill{font-size:11px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:10px;padding:2px 8px}

/* formula bar */
.fbar{display:flex;align-items:stretch;gap:0;background:var(--paper);border-bottom:1px solid var(--line);min-height:30px}
.namebox{width:84px;flex:none;border-right:1px solid var(--line);display:flex;align-items:center;padding:0 8px;font-family:var(--font-cell);font-size:14px}
.fx-icons{display:flex;align-items:center;gap:10px;padding:0 10px;color:#a19f9d;border-right:1px solid var(--line);flex:none;font-size:13px}
.fx-icons i{font-family:Georgia,serif;color:var(--muted)}
.fx{flex:1;display:flex;align-items:center;gap:16px;padding:4px 10px;min-width:0;flex-wrap:wrap}
.fx-text{font-family:var(--font-cell);font-size:14px;white-space:pre-wrap;word-break:break-word}
.fx-src{color:var(--muted);font-size:12px;margin-left:auto}

/* grid */
.sheet-area{flex:1;overflow:auto;background:var(--paper);position:relative}
.zoomer{zoom:var(--zoom);width:max-content}
table.grid{border-collapse:separate;border-spacing:0;table-layout:fixed;font-family:var(--font-cell);font-size:15px;font-variant-numeric:tabular-nums;color:#000;background:var(--paper)}
.grid th,.grid td{height:21px;padding:0 4px;border-right:1px solid var(--grid);border-bottom:1px solid var(--grid);white-space:nowrap;overflow:hidden;text-overflow:clip;line-height:19px}
.grid thead th{position:sticky;top:0;z-index:3;background:var(--chrome);color:#444;font-weight:400;font-size:12px;text-align:center;border-right:1px solid var(--line);border-bottom:1px solid var(--line);font-family:var(--font-ui)}
.grid th.rowhdr{position:sticky;left:0;z-index:2;background:var(--chrome);color:#444;font-weight:400;font-size:12px;text-align:center;border-right:1px solid var(--line);border-bottom:1px solid var(--line);font-family:var(--font-ui);width:42px}
.grid thead th.corner{left:0;z-index:4}
.grid th.on{background:#d9d9d9;color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent)}
.grid th.rowhdr.on{box-shadow:inset -2px 0 0 var(--accent)}
.grid td{cursor:cell;vertical-align:bottom}
.grid td.c{text-align:center}.grid td.r{text-align:right}.grid td.l{text-align:left}
.grid td.b{font-weight:700}
.grid td.u span{text-decoration:underline;text-underline-offset:2px}
.grid td.hdr{white-space:pre-line;line-height:21px;vertical-align:bottom;text-align:center;font-weight:700}
.grid td.hdr span{text-decoration:underline;text-underline-offset:2px}
.grid td.frz,.grid th.frz{position:sticky;z-index:1;background-color:var(--paper)}
.grid thead th.frz{z-index:4;background-color:var(--chrome)}
.grid th.frz.on{background-color:#d9d9d9}
.grid .frz-last{border-right:1px solid #9e9e9e}
.grid td.fy{background:var(--fill-yellow)}
.grid td.fo{background:var(--fill-orange)}
.grid td.ft{background:var(--fill-tan)}
.grid td.fg{background:var(--fill-green)}
.grid td.ind{padding-left:22px}
.grid td.box-l{box-shadow:inset 1px 0 0 #6b6b6b}
.grid td.box-t{box-shadow:inset 0 1px 0 #6b6b6b}
.grid td.box-l.box-t{box-shadow:inset 1px 1px 0 #6b6b6b}
.grid td.box-b{border-bottom:1px solid #6b6b6b}
.grid{touch-action:manipulation}
.grid td.edit{color:#0b3d91}
.grid td.edited{color:#0b57d0;font-style:italic}
.grid td.na{color:#000}
.grid td.insel{background-image:linear-gradient(rgba(33,115,70,.12),rgba(33,115,70,.12))}
.grid td.active{box-shadow:inset 0 0 0 2px var(--accent)}
.grid td input{width:100%;height:19px;border:0;outline:0;font:inherit;padding:0;text-align:right;background:#fff}

/* sources tab */
.doc-page{font-family:var(--font-cell);font-size:15px;line-height:1.45;padding:20px 24px 40px;max-width:1400px}
.doc-page h2{font-size:20px;margin:6px 0 6px;text-wrap:balance}
.doc-page h3{font-size:16px;margin:22px 0 6px}
.doc-page p{max-width:72ch;margin:4px 0}
.doc-page ul{max-width:90ch;padding-left:22px;margin:6px 0}
.doc-page li{margin:4px 0}
.xtable{border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px;margin-top:8px}
.xtable th,.xtable td{border:1px solid var(--grid);padding:3px 8px;white-space:nowrap}
.xtable th{background:var(--chrome);font-weight:700;text-align:center;vertical-align:bottom;white-space:normal;min-width:70px}
.xtable td.n{text-align:right}
.xtable td.diff{background:var(--warn-soft);color:var(--warn-ink)}
.xtable a{color:var(--accent)}
.tblwrap{overflow-x:auto}
.key{display:inline-block;width:12px;height:12px;background:var(--warn-soft);border:1px solid #e3b7b2;vertical-align:-1px;margin-right:4px}

/* tabs + status */
footer{flex:none;background:var(--chrome);border-top:1px solid var(--line)}
.tabs{display:flex;align-items:stretch;gap:0;height:30px;padding-left:8px;overflow-x:auto}
.tab{border:0;background:transparent;padding:0 16px;cursor:pointer;color:#333;white-space:nowrap;border-bottom:3px solid transparent;font-size:13px}
.tab:hover{background:#e6e6e6}
.tab[aria-selected="true"]{background:var(--paper);color:var(--accent);font-weight:600;border-bottom-color:var(--accent)}
.tab-sep{width:1px;background:var(--line);margin:6px 0}
.status{display:flex;align-items:center;gap:18px;height:24px;padding:0 12px;font-size:12px;color:#444;border-top:1px solid var(--line);background:var(--chrome)}
.status .stats{margin-left:auto;display:flex;gap:16px}
.zoomctl{display:flex;align-items:center;gap:6px}
.zoomctl button{border:0;background:transparent;cursor:pointer;font-size:14px;color:#444;width:20px}
.zoomctl input{width:110px;accent-color:var(--accent)}
#toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:#323130;color:#fff;padding:8px 14px;border-radius:4px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){#toast{transition:none}}
@media (max-width:640px){
  .doc-sub{display:none}
  .fx-icons{display:none}
  .zoomctl input{width:70px}
  .status .stats{display:none}
}
@media print{
  .titlebar,.fbar,footer,#toast{display:none!important}
  body{overflow:visible;display:block;background:#fff}
  .sheet-area{overflow:visible}
  .grid thead th,.grid th.rowhdr{display:none}
}
</style>
</head>

function pubYield(h){
  const p = h.pub, y = p.rate*4/h.price*100;
  return ` Public check: latest declared ${money(p.rate, p.rate<1?4:2)}/qtr × 4 ÷ price = ${nf(y,2)}%.`;
}
function pubPE(h){
  const p = h.pub;
  if (p.secEps==null) return ` Public check: ${p.secNote}.`;
  return ` Public check: SEC diluted EPS ${p.secPeriod} = ${money(p.secEps,2)} → P/E ${nf(h.price/p.secEps,1)}${p.secCurrent?"":" (latest quarter not in SEC data yet)"}.`;
}

function renderGrid(){
  const S = SHEETS[state.sheet];
  const sel = state.sel[state.sheet], anc = state.anchor[state.sheet] || sel;
  const rr = [Math.min(sel.r,anc.r), Math.max(sel.r,anc.r)], cc = [Math.min(sel.c,anc.c), Math.max(sel.c,anc.c)];
  const width = 42 + S.cols.reduce((a,c)=>a+c.w,0);
  let h = `<table class="grid" style="width:${width}px" role="grid" aria-label="${state.sheet==="fp"?"Final Portfolio":"Historical Data"}"><colgroup><col style="width:42px">`;
  S.cols.forEach(c=>h+=`<col style="width:${c.w}px">`);
  h += `</colgroup><thead><tr><th class="corner"></th>`;
  const nf_ = frozenCount(state.sheet), lefts = []; let acc = 42; S.cols.forEach((c,i)=>{ lefts[i]=acc; acc+=c.w; });
  const frz = i => i < nf_ ? ` frz${i===nf_-1?" frz-last":""}` : "";
  const frzStyle = i => i < nf_ ? `left:${lefts[i]}px;` : "";
  S.cols.forEach((c,i)=>h+=`<th class="${(i>=cc[0]&&i<=cc[1]?"on":"")+frz(i)}"${i<nf_?` style="${frzStyle(i)}"`:""}>${c.k}</th>`);
  h += `</tr></thead><tbody>`;
  for (let r=1; r<=S.rows; r++){
    const rh = S.rowH[r] || 21;
    h += `<tr style="height:${rh}px"><th class="rowhdr${r>=rr[0]&&r<=rr[1]?" on":""}" style="height:${rh}px">${r}</th>`;
    for (let i=0; i<S.cols.length; i++){
      const addr = S.cols[i].k + r, cell = S.cells[addr];
      const span = cell && cell.span ? cell.span : 1;
      let cls = (cell ? (cell.cls||"") : "") + frz(i);
      if (r>=rr[0]&&r<=rr[1]&&i>=cc[0]&&i<=cc[1] && !(r===sel.r&&i===sel.c)) cls += " insel";
      if (r===sel.r && i===sel.c) cls += " active";
      const style = (rh!==21?`height:${rh}px;`:"") + (cell&&cell.pad?"padding-left:340px;":"") + frzStyle(i);
      const txt = cell ? esc(cell.t) : "";
      h += `<td class="${cls.trim()}" data-r="${r}" data-c="${i}"${span>1?` colspan="${span}"`:""}${style?` style="${style}"`:""}>${txt?`<span>${txt}</span>`:""}</td>`;
      i += span-1;
    }
    h += `</tr>`;
  }
  h += `</tbody></table>`;
  zoomer.innerHTML = h;
  updateFormulaBar(); updateStats();
}
const esc = s => String(s).replace(/[&<>"]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));

function cellAt(sheet, r, c){ const S = SHEETS[sheet]; const k = S.cols[c].k + r; return {addr:k, cell:S.cells[k]}; }
function updateFormulaBar(){
  if (state.sheet==="src"){ nameBox.textContent=""; fxText.textContent=""; fxSrc.textContent=""; return; }
  const s = state.sel[state.sheet], {addr, cell} = cellAt(state.sheet, s.r, s.c);
  nameBox.textContent = addr;
  fxText.textContent = cell ? (cell.f || cell.fv || cell.t || "") : "";
  fxSrc.textContent = cell && cell.src ? cell.src : (cell && cell.f ? "Formula, calculated in this app." : "");
}
function updateStats(){
  const st = document.getElementById("stats");
  if (state.sheet==="src"){ st.textContent=""; return; }
  const sel = state.sel[state.sheet], anc = state.anchor[state.sheet];
  if (!anc || (anc.r===sel.r && anc.c===sel.c)){ st.textContent=""; return; }
  const S = SHEETS[state.sheet], vals=[];
  let count=0;
  for (let r=Math.min(sel.r,anc.r); r<=Math.max(sel.r,anc.r); r++)
    for (let c=Math.min(sel.c,anc.c); c<=Math.max(sel.c,anc.c); c++){
      const cell = S.cells[S.cols[c].k + r]; if (!cell || cell.t==="") continue; count++;
      if (typeof cell.v === "number") vals.push(cell);
    }
  if (!vals.length){ st.textContent = count?`Count: ${count}`:""; return; }
  const t0 = vals[0].t, isMoney = t0.startsWith("$")||t0.startsWith("-$"), isFrac = vals[0].frac===true || (t0.endsWith("%") && Math.abs(vals[0].v) < 5 && !vals[0].fv);
  const sum = vals.reduce((a,c)=>a+c.v,0), av = sum/vals.length;
  const f = v => isMoney ? money(v,2) : (isFrac ? pct(v,2) : nf(v,2) + (t0.endsWith("%")?"%":""));
  st.innerHTML = `<span>Average: ${esc(f(av))}</span><span>Count: ${count}</span><span>Sum: ${esc(f(sum))}</span>`;
}

function curCell(){ const s = state.sel[state.sheet]; return cellAt(state.sheet, s.r, s.c); }
function startEdit(initial){
  if (state.sheet!=="fp") return;
  const {cell} = curCell();
  if (!cell || !cell.edit){ toast("Only Price and # of Shares can be changed. Other cells use formulas or FactSet data."); return; }
  const s = state.sel.fp, td = zoomer.querySelector(`td[data-r="${s.r}"][data-c="${s.c}"]`); if (!td) return;
  const h = MODEL.H[s.r-5];

  td.innerHTML = `<input id="cellEdit" inputmode="decimal" aria-label="New ${cell.edit==="price"?"price":"share count"} for ${esc(h.t)}" value="${initial!=null?esc(initial):esc(cell.edit==="price"?String(h.price):String(h.shares))}">`;

  inp.addEventListener("keydown", ev=>{
    if (ev.key==="Enter"){ ev.preventDefault(); commitEdit(); move(1,0); }

  });

}
function commitEdit(){
  const ed = state.editing; if (!ed) return; const inp = document.getElementById("cellEdit");
  state.editing = null;
  const raw = inp ? inp.value.replace(/[$,\s]/g,"") : ""; const v = Number(raw);
  if (!raw || !isFinite(v) || v <= 0){ toast("Type a number greater than zero."); rebuild(); renderGrid(); return; }
  const base = DATA.holdings.find(h=>h.t===ed.t);
  const val = ed.field==="shares" ? Math.round(v) : v;
  state.edits[ed.t] = state.edits[ed.t] || {};
  if ((ed.field==="price" && Math.abs(val-base.price)<1e-9) || (ed.field==="shares" && val===base.shares)) delete state.edits[ed.t][ed.field];
  else state.edits[ed.t][ed.field] = val;
  if (!Object.keys(state.edits[ed.t]).length) delete state.edits[ed.t];
  saveEdits(); rebuild(); renderGrid(); syncEditUI();
  if (state.totalMode==="workbook" && Object.keys(state.edits).length && !state.warned){ state.warned = true; toast("The Historical total row now uses weights × dividends, because the holdings changed."); }
}
function cancelEdit(){ state.editing=null; renderGrid(); area.focus({preventScroll:true}); }
function move(dr, dc, extend){
  const S = SHEETS[state.sheet], s = state.sel[state.sheet];
  const r = Math.max(1, Math.min(S.rows, s.r+dr)), c = Math.max(0, Math.min(S.cols.length-1, s.c+dc));
  if (extend){ if(!state.anchor[state.sheet]) state.anchor[state.sheet]={...s}; } else state.anchor[state.sheet]={r,c};
  state.sel[state.sheet] = {r,c}; renderGrid(); scrollIntoViewCell(r,c);
}
function scrollIntoViewCell(r,c){
  const td = zoomer.querySelector(`td[data-r="${r}"][data-c="${c}"]`); if (!td) return;
  const z = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--zoom"))||1;
  const a = area.getBoundingClientRect(), b = td.getBoundingClientRect();
  if (b.bottom > a.bottom) area.scrollTop += (b.bottom - a.bottom) + 4;
  if (b.top < a.top + 22*z) area.scrollTop -= (a.top + 22*z - b.top) + 4;
  if (b.right > a.right) area.scrollLeft += (b.right - a.right) + 4;
  if (b.left < a.left + 42*z) area.scrollLeft -= (a.left + 42*z - b.left) + 4;
}
area.addEventListener("keydown", e=>{
  if (state.editing || state.sheet==="src") return;
  const k = e.key;
  if (k==="ArrowDown"){ move(1,0,e.shiftKey); e.preventDefault(); }
  else if (k==="ArrowUp"){ move(-1,0,e.shiftKey); e.preventDefault(); }
  else if (k==="ArrowRight"||(k==="Tab"&&!e.shiftKey)){ move(0,1,e.shiftKey&&k!=="Tab"); e.preventDefault(); }
  else if (k==="ArrowLeft"||(k==="Tab"&&e.shiftKey)){ move(0,-1,e.shiftKey&&k!=="Tab"); e.preventDefault(); }
  else if (k==="Enter"||k==="F2"){ const {cell}=curCell(); if (cell&&cell.edit) startEdit(); else move(1,0); e.preventDefault(); }
  else if (/^[0-9.]$/.test(k) && !e.ctrlKey && !e.metaKey){ const {cell}=curCell(); if (cell&&cell.edit){ startEdit(k); e.preventDefault(); } }
});
